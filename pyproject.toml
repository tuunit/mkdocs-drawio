[project]
name = "mkdocs-drawio"
version = "1.16.3"
description = "MkDocs plugin for embedding Drawio files"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jan Larwig", email = "jan@larwig.com" },
    { name = "Sergey Lukin", email = "onixpro@gmail.com" },
]
requires-python = ">=3.9,<4.0"
dependencies = [
    "requests>=2.0",
    "jinja2>=3.0",
    "beautifulsoup4>=4.0",
    "lxml>=4.8",
    "mkdocs>=1.4",
    "pypng>=0.20220715.0",
]
keywords = ["mkdocs", "plugin", "markdown", "drawio"]

[project.urls]
Homepage = "https://tuunit.github.io/mkdocs-drawio/"
Repository = "https://github.com/tuunit/mkdocs-drawio/"

[project.entry-points."mkdocs.plugins"]
drawio = "mkdocs_drawio.plugin:DrawioPlugin"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ruff>=0.12.5",
    "mkdocs-print-site-plugin>=2.7.3",
    "mkdocs-material>=9.6.15",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mkdocs_drawio*"]
exclude = ["examples*"]

[tool.setuptools.package-data]
mkdocs_drawio = ["css/*.css", "js/*.js"]
